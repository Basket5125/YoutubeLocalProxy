syntax = "proto3";
package android_full_next;

message navigationData {
    message navData {
        string navId = 1;
    }
    optional navData navProperties = 48687757;
}
message textRuns {
    message textRun {
        string text = 1;
        /** The app draws the run with a bold typeface. */
        optional int32 bold = 2;
    }
    repeated textRun run = 1;
}
message thumbnails {
    message thumbnail {
        string url = 1;
        int32 width = 2;
        int32 height = 3;
    }
    repeated thumbnail thumb = 1;
}
message nextRequest {
    int32 int1 = 1;
    message continuationData {
        string token = 1;
        int32 int2 = 2;
    }
    repeated continuationData continuation = 52047593;
}
message simpleText {
    string text = 4;
}
message browseNavigation {
    message browseData {
        string browseId = 2;
        string params = 3;
        string canonicalBaseUrl = 4;
    }
    repeated browseData data = 48687626;
}
message authorData {
    message authorDataContent {
        string authorDisplayName = 1;
        optional browseNavigation navigation = 5;
    }
    optional authorDataContent ac = 1;
}
message authorRendererData {
    optional thumbnails avatars = 1;
    optional textRuns name = 2;
    optional browseNavigation naviData = 4;
    optional textRuns subscribeCount = 5;
    message subscribeButtonData {
        message subContents {
            optional textRuns subscribeButton = 1;
            optional int32 int3 = 3;
            optional int32 int4 = 4;
            optional int32 int6 = 6;
            string channelId = 7;
            optional int32 int8 = 8;
            optional textRuns subscribedLabel = 12;
            optional textRuns subscribeLabel = 13;
            optional textRuns unsubscribeLabel = 16;
            message subAction {
                message sub1 {
                    string id = 1;
                    string params = 3;
                }
                repeated sub1 subscr1 = 68997349;
                message sub2 {
                    string id = 1;
                    string params = 4;
                }
                repeated sub2 subscr2 = 68997401;
            }
            repeated subAction action = 18;
            // The 2017 apps show the channel's subscriber count next to the subscribe button.
            optional textRuns shortSubscriberCount = 20;
            optional textRuns longSubscriberCount = 23;
            string identifier = 31;
        }
        repeated subContents content = 55419609;
    }
    repeated subscribeButtonData subscribeButton = 6;
}
message videoMetadataRenderer {
    optional textRuns title = 1;
    optional textRuns viewCount = 2;
    optional textRuns likeText1 = 3;
    optional textRuns dislikeText1 = 4;
    optional textRuns description = 5;
    optional textRuns likeText2 = 6;
    optional textRuns dislikeText2 = 7;
    optional int32 allowRatings = 8;
    /*optional int32 int9 = 9;*/
    optional textRuns publishDate = 10;
    optional int32 likeStatus = 11;
    string videoId = 12;
    message pbVarious13 {
        message pbVarious {
            optional textRuns videoId = 1;
            optional int32 int2 = 2;
            optional int32 int3 = 3;
            repeated simpleText count1 = 4;
            repeated simpleText count2 = 5;
            optional int32 int13 = 13;
            optional int32 int23 = 23;
        }
        repeated pbVarious pb = 60091038;
    }
    repeated pbVarious13 pb13 = 13;
    optional textRuns string17 = 17;
    optional textRuns shortViewCount = 18;
    optional int32 isLimitedState = 24;
    message pbVarious25 {
        message unk1 {
            optional int32 int1 = 2;
        }
        repeated unk1 unk = 71271859;
    }
    repeated pbVarious25 pb25 = 25;
    message videoActions {
        message container {
            optional int32 int3 = 3;
            optional textRuns actionName = 5;
            message pb8 {
                optional int32 int1 = 1;
            }
            repeated pb8 proto8 = 8;
            message pb10 {
                string actionName = 2;
            }
            repeated pb10 proto10 = 10;
            message pb19 {
                message targetDataEntry {
                    optional navigationData targetId = 2;
                }
                repeated targetDataEntry targetEntry = 49706687;
            }
            repeated pb19 proto19 = 19;
        }
        repeated container c = 65153809;
    }
    repeated videoActions videoAction = 31;
    optional textRuns str33 = 33;
    optional textRuns str37 = 37;
    optional int32 pb38 = 38;
    optional int32 pb43 = 43;
}
// ---------------------------------------------------------------- watch page of the 2017 apps
// Apps from version 12 show the watch metadata with slimVideoMetadataRenderer (title, the two
// subtitles, the buttons under the video, the channel and the description); they parse
// videoMetadataRenderer but have no view for it, so the data below is what they display.
message iconContainer {
    int32 iconType = 1;
}
message buttonRenderer {
    optional textRuns text = 5;
    /** What a tap does; the app reads this one and field 9 of the button. */
    optional buttonEndpoint serviceEndpoint = 7;
    optional iconContainer icon = 8;
    optional buttonEndpoint navigationEndpoint = 9;
}
/**
 * The share endpoint is an Android share intent spelled out: the app puts every extra into an
 * ACTION_SEND intent, sets the type and opens the chooser (class due of YouTube 12.45.56).
 */
message buttonEndpoint {
    message shareIntent {
        message extra {
            string key = 1;
            string value = 2;
        }
        repeated extra extras = 1;
        string type = 2;
        string chooserTitle = 4;
    }
    optional shareIntent share = 106983893;
}
message slimMetadataButton {
    message slimMetadataButtonRenderer {
        message buttonContainer {
            optional buttonRenderer button = 65153809;
        }
        optional buttonContainer button = 22;
    }
    repeated slimMetadataButtonRenderer button = 124608017;
}
message slimOwner {
    message slimOwnerRenderer {
        optional thumbnails avatar = 1;
        optional textRuns title = 2;
        optional browseNavigation navigation = 3;
        message subscribeContainer {
            repeated authorRendererData.subscribeButtonData.subContents button = 55419609;
        }
        optional subscribeContainer subscribeButton = 4;
    }
    repeated slimOwnerRenderer owner = 119170535;
}
message slimVideoMetadataRenderer {
    optional textRuns title = 3;
    /** Shown while the panel is collapsed, for example "1.2M views". */
    optional textRuns collapsedSubtitle = 4;
    /** Shown while it is expanded, for example "1,234,567 views - Published on Oct 3, 2024". */
    optional textRuns expandedSubtitle = 5;
    repeated slimMetadataButton buttons = 6;
    optional slimOwner owner = 8;
    optional textRuns description = 9;
    string videoId = 14;
}
message compactVideoRenderer {
    string videoId = 1;
    optional thumbnails thumblist = 2;
    optional textRuns titleData = 3;
    optional authorData shortAuthorData = 4;
    optional textRuns publishedTimeText = 5;
    optional textRuns viewCountText = 6;
    optional textRuns lengthText = 7;
    optional navigationData navData = 8;
    optional authorData longAuthorData = 10;
    optional thumbnails authorAvatar = 14;
    optional textRuns shortViewCounts = 23;
}
// Continuations: the app sends the token back in the request's field 8 and expects the answer
// in continuationContents.sectionListContinuation.
message continuations {
    message nextContinuationData {
        string token = 1;
    }
    repeated nextContinuationData next = 52047593;
}
// Comments, as the 2017 apps read them (renderer ids and field numbers from the app itself:
// commentThreadRenderer 62285833 holds the comment at 62285947, whose author is field 1, its
// picture field 2, the text field 4 and the time field 28).
message commentRenderer {
    optional textRuns author = 1;
    optional thumbnails authorThumbnail = 2;
    optional browseNavigation authorEndpoint = 3;
    optional textRuns content = 4;
    string commentId = 9;
    optional textRuns publishedTime = 28;
}
message commentThreadRenderer {
    message commentWrapper {
        optional commentRenderer comment = 62285947;
    }
    optional commentWrapper comment = 1;
}
message root {
    message contents {
        message singleColumnWatchNextResults {
            message contents {
                message results {
                    message contents {
                        message itemSectionRenderer {
                            message contents {
                                repeated videoMetadataRenderer videoMetadata = 51779720;
                                repeated authorRendererData authorData = 51779708;
                                repeated compactVideoRenderer nextVideo = 50630979;
                                repeated slimVideoMetadataRenderer slimVideoMetadata = 119167901;
                                repeated commentThreadRenderer commentThread = 62285833;
                            }
                            repeated contents content = 1;
                            repeated nextRequest commentRequest = 2;
                            string identifier = 7;
                        }
                        repeated itemSectionRenderer itemSectionRender = 50195462;
                    }
                    repeated contents content = 1;
                    repeated continuations continuation = 2;
                }
                repeated results result = 49399797;
            }
            repeated contents content = 1;
        }
        repeated singleColumnWatchNextResults nextResults = 51779735;
    }
    repeated contents content = 7;
    message continuationContents {
        repeated contents.singleColumnWatchNextResults.contents.results sectionListContinuation = 49399797;
        /** The answer to a comment continuation: more entries for the section already shown. */
        repeated contents.singleColumnWatchNextResults.contents.results.contents.itemSectionRenderer
                itemSectionContinuation = 50195462;
    }
    optional continuationContents continuation = 8;
    optional navigationData navigationEndpoint = 9;
    message playerOverlays {
        message playerOverlaysRenderer {}
        optional playerOverlaysRenderer overlay = 78882851;
    }
    optional playerOverlays poverlays = 14;
}