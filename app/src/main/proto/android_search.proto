syntax = "proto3";
package android_search;

message textRuns {
    message textRun {
        string text = 1;
    }
    repeated textRun run = 1;
}
message simpleText {
    string text = 4;
}
message thumbnails {
    message thumbnail {
        string url = 1;
        int32 width = 2;
        int32 height = 3;
    }
    repeated thumbnail thumb = 1;
}
message browseNavigation {
    message browseData {
        string browseId = 2;
        string params = 3;
        string canonicalBaseUrl = 4;
    }
    repeated browseData data = 48687626;
}
message authorData {
    message authorDataContent {
        string authorDisplayName = 1;
        optional browseNavigation navigation = 5;
    }
    optional authorDataContent ac = 1;
}
message navigationData {
    message navData {
        string navId = 1;
    }
    optional navData navProperties = 48687757;
}
message compactVideoRenderer {
    string videoId = 1;
    optional thumbnails thumblist = 2;
    optional textRuns titleData = 3;
    optional authorData shortAuthorData = 4;
    optional textRuns publishedTimeText = 5;
    optional textRuns viewCountText = 6;
    optional textRuns lengthText = 7;
    optional navigationData navData = 8;
    optional authorData longAuthorData = 10;
    optional thumbnails authorAvatar = 14;
    optional textRuns shortViewCounts = 23;
}
message playlistRenderer {
    string id = 1;
    optional thumbnails thumbnail = 2;
    optional textRuns playlistName = 3;
    optional authorData shortOwner = 4;
    optional textRuns videoCount = 5;
    optional browseNavigation playlistBrowse = 6;
    optional textRuns bareVideoCount = 9;
    optional thumbnails separatedThumbnail = 13;
    optional textRuns videoCount2 = 15;
    string webUrl = 19;
    optional authorData longOwner = 21;
}
message channelRenderer {
    string id = 1;
    optional thumbnails avatar = 2;
    // Where the 2017 apps put these on a channel card: field 9 is the name, field 4 the line
    // under it and field 3 the second count line.
    optional textRuns videoCount = 3;
    optional textRuns subCount = 4;
    optional textRuns handle = 5;
    optional browseNavigation navigation = 6;
    optional textRuns name = 9;
    optional thumbnails avatar2 = 16;
}
// The app asks for the next page when the last result is on screen: it takes the token out of
// the section list's continuations and sends it back, and expects the answer in
// continuationContents.sectionListContinuation (the same renderer id, 49399797).
message continuations {
    message nextContinuationData {
        string token = 1;
    }
    repeated nextContinuationData next = 52047593;
}
message root {
    message contents {
        message searchResults {
            message contents {
                message itemSectionRender {
                    message contents {
                        repeated compactVideoRenderer video = 50630979;
                        repeated playlistRenderer playlist = 50742631;
                        repeated channelRenderer channel = 50794305;
                    }
                    repeated contents content = 1;
                }
                repeated itemSectionRender section = 50195462;
            }
            repeated contents content = 1;
            repeated continuations continuation = 2;
        }
        repeated searchResults resultsContainer = 49399797;
    }
    repeated contents content = 4;
    message continuationContents {
        repeated contents.searchResults sectionListContinuation = 49399797;
    }
    optional continuationContents continuation = 7;
}