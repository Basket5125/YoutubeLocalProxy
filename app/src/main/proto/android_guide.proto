syntax = "proto3";
package android_guide;

message textRuns {
    message textRun {
        string text = 1;
    }
    repeated textRun run = 1;
}
message browseNavigation {
    message browseData {
        string browseId = 2;
        string params = 3;
        string canonicalBaseUrl = 4;
    }
    repeated browseData data = 48687626;
}
message guideEntry {
    repeated browseNavigation navigation = 1;
    string title = 2;
    repeated textRuns iconPath = 3;
    message iconContainer {
        int32 iconType = 1;
    }
    string subtext = 6;
    repeated iconContainer icon = 7;
    repeated textRuns name = 10;
}
message pivotBarItem {
    // The bottom bar of the 2017 apps (version 12+). One entry; the app needs the identifier,
    // the endpoint, a title and an icon (it reads the icon without checking for null).
    message pivotBarItemRenderer {
        string pivotIdentifier = 1;
        repeated browseNavigation navigation = 2;
        repeated textRuns title = 3;
        message iconContainer {
            int32 iconType = 1;
        }
        repeated iconContainer icon = 5;
    }
    repeated pivotBarItemRenderer item = 117501096;
}
message root {
    message items {
        message guideSectionRenderer {
            message contents {
                repeated guideEntry entry = 50982577;
            }
            repeated contents content = 3;
            string header = 4;
        }
        repeated guideSectionRenderer guideSection = 46887524;
        message pivotBarRenderer {
            repeated pivotBarItem items = 1;
        }
        repeated pivotBarRenderer pivotBar = 117866661;
    }
    repeated items item = 4;
}