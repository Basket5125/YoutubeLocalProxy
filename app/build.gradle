apply plugin: 'com.android.application'

android {
    namespace 'com.viitube.proxy'
    compileSdk 33

    defaultConfig {
        applicationId "net.truehosting.ytproxy"
        minSdkVersion 9
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
